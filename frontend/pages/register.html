<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartDRM-X | Register</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="auth-body">
    <div class="auth-container">
        <div class="brand">
            <div class="logo">S</div>
            <h1>SmartDRM-X</h1>
        </div>
        <p class="subtitle">Join the Secure Research Network</p>

        <div class="card" id="register-card">
            <h2>Initialize Identity</h2>
            <form id="register-form">
                <div class="input-group">
                    <label>New Username</label>
                    <input type="text" id="reg-username" required placeholder="Choose ID">
                </div>
                <div class="input-group">
                    <label>Set Password</label>
                    <input type="password" id="reg-password" required placeholder="Create Password">
                </div>
                <div class="input-group">
                    <label>Role</label>
                    <select id="reg-role">
                        <option value="user">Researcher / Creator</option>
                        <option value="admin">System Administrator</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-success btn-block">Create Identity</button>
            </form>
            <p class="switch-auth">Existing credentials? <a href="login.html">Login</a></p>
        </div>
    </div>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
</body>

</html>
