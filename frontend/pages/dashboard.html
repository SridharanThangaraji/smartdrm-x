<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartDRM-X | Dashboard</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-layout">
        <!-- Sidebar Container -->
        <div id="sidebar-container"></div>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Topbar Container -->
            <div id="topbar-container"></div>

            <div class="content-container">
                <h1 class="page-title">Dashboard</h1>
                <p class="card-desc">Overview of your assets, licenses, and risk level.</p>

                <div class="grid grid-cols-4">
                    <div class="card stat-card">
                        <div class="label">Assets owned</div>
                        <div class="value" id="stat-assets">…</div>
                    </div>
                    <div class="card stat-card">
                        <div class="label">Active licenses</div>
                        <div class="value" id="stat-licenses">…</div>
                    </div>
                    <div class="card stat-card">
                        <div class="label">Risk level</div>
                        <div class="value" id="stat-risk">…</div>
                    </div>
                    <div class="card stat-card">
                        <div class="label">System</div>
                        <div class="value" style="color: var(--success); font-size: 1.25rem;">Online</div>
                    </div>
                </div>

                <div class="card" style="margin-top: 24px;">
                    <h2>Quick actions</h2>
                    <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                        <a href="upload.html" class="btn btn-primary">Upload asset</a>
                        <a href="assets.html" class="btn btn-secondary" style="background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-primary); text-decoration: none;">Manage assets</a>
                        <a href="ai.html" class="btn btn-secondary" style="background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-primary); text-decoration: none;">AI analytics</a>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/components.js"></script>
    <script src="../assets/js/modules/dashboard.js"></script>
</body>

</html>
