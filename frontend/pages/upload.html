<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartDRM-X | Upload</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-layout">
        <div id="sidebar-container"></div>

        <main class="main-content">
            <div id="topbar-container"></div>

            <div class="content-container">
                <h1 class="page-title">Upload asset</h1>
                <p class="card-desc">Files are encrypted with AES-256-GCM before storage. A content hash is registered on-chain for integrity.</p>

                <div class="card" style="max-width: 560px;">
                    <h2>New asset</h2>
                    <form id="upload-form">
                        <div class="upload-zone" id="drop-zone">
                            <input type="file" id="file-input" required style="display: none">
                            <div class="drop-area" id="drop-area" title="Click or drag a file">
                                <div class="icon-large">📄</div>
                                <span id="file-label">Choose a file or drag it here</span>
                                <p class="hint">Single file, any type. Max size depends on server.</p>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 20px;">Encrypt & upload</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/components.js"></script>
    <script src="../assets/js/modules/upload.js"></script>
</body>

</html>
