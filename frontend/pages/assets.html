<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartDRM-X | Assets</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-layout">
        <div id="sidebar-container"></div>

        <main class="main-content">
            <div id="topbar-container"></div>

            <div class="content-container">
                <h1 class="page-title">Asset Repository</h1>

                <div class="card">
                    <h2>My Uploaded Assets</h2>
                    <div class="table-responsive">
                        <table class="data-table" id="assets-table">
                            <thead>
                                <tr>
                                    <th>Filename</th>
                                    <th>Hash (Blockchain)</th>
                                    <th>Date</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="assets-body">
                                <tr>
                                    <td colspan="4" class="text-center">Loading assets...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/components.js"></script>
    <script src="../assets/js/modules/assets.js"></script>
</body>

</html>
